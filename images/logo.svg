<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="100%" height="100%" fill="none">
  <!-- 119 LAUNDRY & DRY CLEANING MASTER LOGO -->
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0A1E3F" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Modern Laundry Icon / Badge -->
  <g transform="translate(6, 6)">
    <!-- Outer Rounded Square / Washer Frame -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0A1E3F" />
    
    <!-- Washing Machine Door / Porthole Ring -->
    <circle cx="32" cy="32" r="23" stroke="#1D4ED8" stroke-width="3.5" fill="#0F172A" />
    
    <!-- Water Cycle Wave Curve -->
    <path d="M 17 34 C 21 28, 27 28, 32 34 C 37 40, 43 40, 47 34" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 19 39 C 23 35, 28 35, 32 39 C 36 43, 41 43, 45 39" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.75" fill="none" />

    <!-- Sparkle / Fresh Clean Star in upper right -->
    <path d="M 45 13 L 46.5 17.5 L 51 19 L 46.5 20.5 L 45 25 L 43.5 20.5 L 39 19 L 43.5 17.5 Z" fill="#38BDF8" />
    <circle cx="20" cy="18" r="2.5" fill="#60A5FA" opacity="0.9" />
  </g>

  <!-- Typographic Identity: 119 Primary Hero -->
  <!-- "119" is the strongest, most prominent element -->
  <text x="84" y="47" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0A1E3F" letter-spacing="-1.5">119</text>

  <!-- "LAUNDRY" in bold clean black -->
  <text x="178" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="2.5">LAUNDRY</text>
  
  <!-- "& DRY CLEANING" subtitle in clean navy/slate -->
  <text x="179" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="3.2">DRY CLEANING</text>

  <!-- Accent dot/sparkle -->
  <circle cx="316" cy="30" r="3.5" fill="#1D4ED8" />
</svg>
